<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">MonoSparse-CAM method overview</title>
  <desc id="desc">A decision tree is mapped into content-addressable memory. Feature reordering groups active cells, while a status register skips rows whose matchlines have already discharged.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315f9f" />
    </marker>
    <style>
      .panel { fill: #ffffff; stroke: #cfd8e3; stroke-width: 2; }
      .heading { font: 700 24px Georgia, serif; fill: #222222; }
      .label { font: 18px Georgia, serif; fill: #333333; }
      .small { font: 15px Georgia, serif; fill: #555555; }
      .cell { fill: #dce8f5; stroke: #6c8ebf; stroke-width: 1.5; }
      .active { fill: #7aa6d8; stroke: #315f9f; stroke-width: 1.5; }
      .skip { fill: #f1f1f1; stroke: #b8b8b8; stroke-width: 1.5; }
      .alive { stroke: #26845b; stroke-width: 8; stroke-linecap: round; }
      .dead { stroke: #a8a8a8; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 10 8; }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#f7f9fc" />
  <text x="600" y="50" text-anchor="middle" class="heading" font-size="30">MonoSparse-CAM</text>
  <text x="600" y="82" text-anchor="middle" class="label">Eliminate redundant work using sparsity and matchline monotonicity</text>

  <rect class="panel" x="40" y="120" width="330" height="430" rx="8" />
  <text class="heading" x="205" y="160" text-anchor="middle">1. Map the tree</text>
  <circle cx="205" cy="205" r="19" fill="#315f9f" />
  <circle cx="150" cy="270" r="17" fill="#6c8ebf" />
  <circle cx="260" cy="270" r="17" fill="#6c8ebf" />
  <circle cx="120" cy="335" r="15" fill="#9bb9db" />
  <circle cx="180" cy="335" r="15" fill="#9bb9db" />
  <circle cx="230" cy="335" r="15" fill="#9bb9db" />
  <circle cx="290" cy="335" r="15" fill="#9bb9db" />
  <path d="M195 222 L160 253 M215 222 L250 253 M145 287 L126 318 M155 287 L174 318 M255 287 L236 318 M265 287 L284 318" fill="none" stroke="#527bbd" stroke-width="3" />
  <text class="small" x="205" y="390" text-anchor="middle">Each root-to-leaf path becomes</text>
  <text class="small" x="205" y="414" text-anchor="middle">a CAM row with many don't-care cells.</text>
  <g transform="translate(88 445)">
    <rect class="active" x="0" y="0" width="35" height="35" />
    <rect class="cell" x="40" y="0" width="35" height="35" />
    <rect class="skip" x="80" y="0" width="35" height="35" />
    <rect class="skip" x="120" y="0" width="35" height="35" />
    <rect class="active" x="160" y="0" width="35" height="35" />
    <rect class="skip" x="200" y="0" width="35" height="35" />
    <text class="small" x="97" y="60" text-anchor="middle">active</text>
    <text class="small" x="200" y="60" text-anchor="middle">don't care</text>
  </g>

  <path d="M382 335 L425 335" stroke="#315f9f" stroke-width="3" marker-end="url(#arrow)" />

  <rect class="panel" x="435" y="120" width="330" height="430" rx="8" />
  <text class="heading" x="600" y="160" text-anchor="middle">2. Group active cells</text>
  <text class="small" x="600" y="192" text-anchor="middle">Feature reordering concentrates useful work.</text>
  <g transform="translate(485 225)">
    <rect class="active" x="0" y="0" width="42" height="42" />
    <rect class="active" x="47" y="0" width="42" height="42" />
    <rect class="cell" x="94" y="0" width="42" height="42" />
    <rect class="skip" x="141" y="0" width="42" height="42" />
    <rect class="skip" x="188" y="0" width="42" height="42" />
    <rect class="active" x="0" y="47" width="42" height="42" />
    <rect class="cell" x="47" y="47" width="42" height="42" />
    <rect class="cell" x="94" y="47" width="42" height="42" />
    <rect class="skip" x="141" y="47" width="42" height="42" />
    <rect class="skip" x="188" y="47" width="42" height="42" />
    <rect class="active" x="0" y="94" width="42" height="42" />
    <rect class="active" x="47" y="94" width="42" height="42" />
    <rect class="active" x="94" y="94" width="42" height="42" />
    <rect class="skip" x="141" y="94" width="42" height="42" />
    <rect class="skip" x="188" y="94" width="42" height="42" />
    <rect class="cell" x="0" y="141" width="42" height="42" />
    <rect class="active" x="47" y="141" width="42" height="42" />
    <rect class="cell" x="94" y="141" width="42" height="42" />
    <rect class="skip" x="141" y="141" width="42" height="42" />
    <rect class="skip" x="188" y="141" width="42" height="42" />
  </g>
  <text class="label" x="555" y="444" text-anchor="middle">active tiles</text>
  <text class="label" x="690" y="444" text-anchor="middle" fill="#777777">empty tiles</text>
  <rect x="477" y="470" width="246" height="45" rx="5" fill="#edf3fa" stroke="#6c8ebf" />
  <text class="small" x="600" y="498" text-anchor="middle">Skip empty feature tiles</text>

  <path d="M777 335 L820 335" stroke="#315f9f" stroke-width="3" marker-end="url(#arrow)" />

  <rect class="panel" x="830" y="120" width="330" height="430" rx="8" />
  <text class="heading" x="995" y="160" text-anchor="middle">3. Track live rows</text>
  <text class="small" x="995" y="192" text-anchor="middle">A discharged matchline cannot recover.</text>
  <rect x="865" y="225" width="260" height="54" rx="5" fill="#edf3fa" stroke="#6c8ebf" />
  <text class="label" x="995" y="258" text-anchor="middle">Status register: 1 0 1 0</text>
  <text class="small" x="877" y="322">row 1</text>
  <line class="alive" x1="940" y1="316" x2="1115" y2="316" />
  <text class="small" x="877" y="372">row 2</text>
  <line class="dead" x1="940" y1="366" x2="1115" y2="366" />
  <text class="small" x="877" y="422">row 3</text>
  <line class="alive" x1="940" y1="416" x2="1115" y2="416" />
  <text class="small" x="877" y="472">row 4</text>
  <line class="dead" x1="940" y1="466" x2="1115" y2="466" />
  <text class="small" x="995" y="514" text-anchor="middle">Skip all later work for dead rows</text>

  <rect x="285" y="580" width="630" height="42" rx="21" fill="#012169" />
  <text x="600" y="607" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#ffffff">Fewer loaded cells + fewer active rows = less CAM energy</text>
</svg>
